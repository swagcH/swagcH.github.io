<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#07111d"/>
  <text x="72" y="70" fill="#22d3ee" font-family="Menlo,Consolas,monospace" font-size="20">RABBITMQ / RELIABLE DELIVERY</text>
  <text x="72" y="126" fill="#f2f7fb" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700">三个环节都可能丢消息</text>

  <!-- 流程 -->
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <rect x="72" y="180" width="260" height="88" rx="10" fill="#101a29" stroke="#22d3ee" stroke-width="2"/>
    <text x="104" y="216" fill="#22d3ee" font-family="Menlo,Consolas,monospace" font-size="16">PRODUCER</text>
    <text x="104" y="246" fill="#f2f7fb" font-size="19">生产者发送</text>

    <rect x="510" y="180" width="260" height="88" rx="10" fill="#101a29" stroke="#fbbf24" stroke-width="2"/>
    <text x="542" y="216" fill="#fbbf24" font-family="Menlo,Consolas,monospace" font-size="16">BROKER</text>
    <text x="542" y="246" fill="#f2f7fb" font-size="19">交换机 → 队列</text>

    <rect x="948" y="180" width="260" height="88" rx="10" fill="#101a29" stroke="#34d399" stroke-width="2"/>
    <text x="980" y="216" fill="#34d399" font-family="Menlo,Consolas,monospace" font-size="16">CONSUMER</text>
    <text x="980" y="246" fill="#f2f7fb" font-size="19">消费并处理</text>

    <!-- 箭头 -->
    <path d="M332 224H510" stroke="#70869b" stroke-width="3"/>
    <path d="M494 214L510 224L494 234" fill="none" stroke="#70869b" stroke-width="3"/>
    <path d="M770 224H948" stroke="#70869b" stroke-width="3"/>
    <path d="M932 214L948 224L932 234" fill="none" stroke="#70869b" stroke-width="3"/>

    <circle cx="421" cy="200" r="18" fill="#0b1522" stroke="#fb7185" stroke-width="2"/>
    <text x="414" y="207" fill="#fb7185" font-family="Menlo,Consolas,monospace" font-size="17">1</text>
    <circle cx="859" cy="200" r="18" fill="#0b1522" stroke="#fb7185" stroke-width="2"/>
    <text x="852" y="207" fill="#fb7185" font-family="Menlo,Consolas,monospace" font-size="17">2</text>
    <circle cx="1216" cy="224" r="18" fill="#0b1522" stroke="#fb7185" stroke-width="2"/>
    <text x="1209" y="231" fill="#fb7185" font-family="Menlo,Consolas,monospace" font-size="17">3</text>
  </g>

  <!-- 三个环节的说明(固定列) -->
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <!-- 环节1 -->
    <rect x="72" y="312" width="360" height="300" rx="12" fill="#101a29" stroke="#fb7185"/>
    <text x="100" y="348" fill="#fb7185" font-family="Menlo,Consolas,monospace" font-size="16">① 生产者 → Broker</text>
    <text x="100" y="384" fill="#9eb0c2" font-size="16">可能丢：网络抖动 / Broker 重启</text>
    <rect x="100" y="404" width="304" height="1" fill="#294158"/>
    <text x="100" y="440" fill="#34d399" font-size="17" font-weight="700">方案：发布者确认</text>
    <text x="100" y="472" fill="#c9d6e2" font-size="16" font-family="Menlo,Consolas,monospace">publisher-confirm-type</text>
    <text x="100" y="500" fill="#c9d6e2" font-size="16" font-family="Menlo,Consolas,monospace">publisher-returns</text>
    <text x="100" y="538" fill="#9eb0c2" font-size="15">Confirm 只保证到达交换机</text>
    <text x="100" y="562" fill="#9eb0c2" font-size="15">路由失败要用 Returns 捕获</text>
    <text x="100" y="594" fill="#6f8497" font-size="14">未确认的消息要落库补偿</text>

    <!-- 环节2 -->
    <rect x="460" y="312" width="360" height="300" rx="12" fill="#101a29" stroke="#fb7185"/>
    <text x="488" y="348" fill="#fb7185" font-family="Menlo,Consolas,monospace" font-size="16">② Broker 内部</text>
    <text x="488" y="384" fill="#9eb0c2" font-size="16">可能丢：未落盘就宕机</text>
    <rect x="488" y="404" width="304" height="1" fill="#294158"/>
    <text x="488" y="440" fill="#34d399" font-size="17" font-weight="700">方案：三者都要持久化</text>
    <text x="488" y="472" fill="#c9d6e2" font-size="16">· 交换机 durable = true</text>
    <text x="488" y="500" fill="#c9d6e2" font-size="16">· 队列 durable = true</text>
    <text x="488" y="528" fill="#c9d6e2" font-size="16">· 消息 PERSISTENT</text>
    <text x="488" y="562" fill="#9eb0c2" font-size="15">缺一个：重启后消息或路由丢失</text>
    <text x="488" y="594" fill="#6f8497" font-size="14">代价：写磁盘会降低吞吐</text>

    <!-- 环节3 -->
    <rect x="848" y="312" width="360" height="300" rx="12" fill="#101a29" stroke="#fb7185"/>
    <text x="876" y="348" fill="#fb7185" font-family="Menlo,Consolas,monospace" font-size="16">③ 消费者处理</text>
    <text x="876" y="384" fill="#9eb0c2" font-size="16">可能丢：处理失败 / ACK 丢失</text>
    <rect x="876" y="404" width="304" height="1" fill="#294158"/>
    <text x="876" y="440" fill="#34d399" font-size="17" font-weight="700">方案：手动 ACK + 幂等</text>
    <text x="876" y="472" fill="#c9d6e2" font-size="16" font-family="Menlo,Consolas,monospace">acknowledge-mode: manual</text>
    <text x="876" y="506" fill="#9eb0c2" font-size="15">区分业务异常（不重试）</text>
    <text x="876" y="530" fill="#9eb0c2" font-size="15">与系统异常（重试）</text>
    <text x="876" y="562" fill="#fbbf24" font-size="15">默认 auto 模式是坑：抛异常也 ACK</text>
    <text x="876" y="594" fill="#6f8497" font-size="14">重试要有上限，超限进死信</text>
  </g>

  <!-- 底部结论 -->
  <rect x="72" y="636" width="1136" height="60" rx="10" fill="#0b1522" stroke="#294158"/>
  <text x="104" y="673" fill="#a9bac9" font-family="Menlo,Consolas,monospace" font-size="17">at-least-once ≠ exactly-once　→　消费端必须假设消息可能重复投递</text>
</svg>
