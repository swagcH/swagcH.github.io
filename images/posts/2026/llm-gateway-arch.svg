<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="#07111d"/>
  <text x="72" y="70" fill="#22d3ee" font-family="Menlo,Consolas,monospace" font-size="20">LLM GATEWAY / ARCHITECTURE</text>
  <text x="72" y="126" fill="#f2f7fb" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700">统一入口 + 降级链</text>

  <g font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <!-- 业务应用 -->
    <rect x="72" y="170" width="1136" height="76" rx="10" fill="#101a29" stroke="#294158"/>
    <text x="100" y="202" fill="#6f8497" font-family="Menlo,Consolas,monospace" font-size="15">CLIENTS</text>
    <rect x="100" y="212" width="180" height="26" rx="6" fill="#0b1522" stroke="#294158"/>
    <text x="126" y="231" fill="#c9d6e2" font-size="14">项目 A</text>
    <rect x="294" y="212" width="180" height="26" rx="6" fill="#0b1522" stroke="#294158"/>
    <text x="320" y="231" fill="#c9d6e2" font-size="14">项目 B</text>
    <rect x="488" y="212" width="180" height="26" rx="6" fill="#0b1522" stroke="#294158"/>
    <text x="514" y="231" fill="#c9d6e2" font-size="14">脚本 / 工具</text>
    <text x="700" y="231" fill="#6f8497" font-size="14">← 只改 base_url 与 api_key，零适配</text>

    <path d="M640 246V282" stroke="#70869b" stroke-width="3"/>
    <path d="M631 270L640 282L649 270" fill="none" stroke="#70869b" stroke-width="3"/>

    <!-- 网关 -->
    <rect x="72" y="282" width="1136" height="150" rx="12" fill="#101a29" stroke="#22d3ee" stroke-width="2"/>
    <text x="100" y="316" fill="#22d3ee" font-family="Menlo,Consolas,monospace" font-size="16">LLM GATEWAY · 统一 OpenAI 兼容协议</text>

    <rect x="100" y="334" width="200" height="76" rx="8" fill="#0b1522" stroke="#294158"/>
    <text x="122" y="362" fill="#c9d6e2" font-size="15">统一鉴权</text>
    <text x="122" y="386" fill="#6f8497" font-size="13">master key</text>

    <rect x="320" y="334" width="200" height="76" rx="8" fill="#0b1522" stroke="#294158"/>
    <text x="342" y="362" fill="#c9d6e2" font-size="15">模型路由</text>
    <text x="342" y="386" fill="#6f8497" font-size="13">前缀 + 别名</text>

    <rect x="540" y="334" width="200" height="76" rx="8" fill="#0f2b22" stroke="#34d399" stroke-width="2"/>
    <text x="562" y="362" fill="#34d399" font-size="15">降级链</text>
    <text x="562" y="386" fill="#6f8497" font-size="13">fallback</text>

    <rect x="760" y="334" width="200" height="76" rx="8" fill="#0b1522" stroke="#294158"/>
    <text x="782" y="362" fill="#c9d6e2" font-size="15">超时控制</text>
    <text x="782" y="386" fill="#6f8497" font-size="13">240s</text>

    <rect x="980" y="334" width="200" height="76" rx="8" fill="#0b1522" stroke="#294158"/>
    <text x="1002" y="362" fill="#c9d6e2" font-size="15">用量与延迟统计</text>
    <text x="1002" y="386" fill="#6f8497" font-size="13">可观测</text>

    <path d="M640 432V468" stroke="#70869b" stroke-width="3"/>
    <path d="M631 456L640 468L649 456" fill="none" stroke="#70869b" stroke-width="3"/>

    <!-- 供应商 -->
    <rect x="72" y="468" width="266" height="106" rx="10" fill="#101a29" stroke="#a78bfa"/>
    <text x="100" y="500" fill="#a78bfa" font-family="Menlo,Consolas,monospace" font-size="15">ark-*</text>
    <text x="100" y="528" fill="#f2f7fb" font-size="16">火山方舟</text>
    <text x="100" y="554" fill="#9eb0c2" font-size="13">Coding Plan 有 5h 配额</text>

    <rect x="362" y="468" width="266" height="106" rx="10" fill="#101a29" stroke="#a78bfa"/>
    <text x="390" y="500" fill="#a78bfa" font-family="Menlo,Consolas,monospace" font-size="15">r4-*</text>
    <text x="390" y="528" fill="#f2f7fb" font-size="16">R4coder</text>
    <text x="390" y="554" fill="#9eb0c2" font-size="13">需伪装浏览器 UA</text>

    <rect x="652" y="468" width="266" height="106" rx="10" fill="#101a29" stroke="#a78bfa"/>
    <text x="680" y="500" fill="#a78bfa" font-family="Menlo,Consolas,monospace" font-size="15">cc-*</text>
    <text x="680" y="528" fill="#f2f7fb" font-size="16">CommandCode</text>
    <text x="680" y="554" fill="#9eb0c2" font-size="13">CF 拦截 error 1010</text>

    <rect x="942" y="468" width="266" height="106" rx="10" fill="#101a29" stroke="#a78bfa"/>
    <text x="970" y="500" fill="#a78bfa" font-family="Menlo,Consolas,monospace" font-size="15">szmf-*</text>
    <text x="970" y="528" fill="#f2f7fb" font-size="16">数智魔方</text>
    <text x="970" y="554" fill="#9eb0c2" font-size="13">baseURL 必须带 /v1</text>

    <!-- 降级说明 -->
    <rect x="72" y="598" width="1136" height="138" rx="12" fill="#0b1522" stroke="#34d399"/>
    <text x="100" y="632" fill="#34d399" font-family="Menlo,Consolas,monospace" font-size="16">FALLBACK CHAIN · 哪些错误会触发降级</text>

    <text x="100" y="668" fill="#34d399" font-size="17">✅ 会降级：429 限流 · 5xx 服务端错误 · 超时 · 连接失败</text>
    <text x="100" y="698" fill="#fb7185" font-size="17">❌ 不会降级：400 参数错误 · 401 鉴权失败 · 内容审核拒绝</text>
    <text x="100" y="724" fill="#9eb0c2" font-size="14">关键：参数错误若也降级，会在 4 家之间白跑一圈，延迟翻 4 倍却仍是同一个错误</text>
  </g>
</svg>
