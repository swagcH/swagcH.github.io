custom_file_path:
  style: source/_data/styles.styl
  bodyEnd: source/_data/body-end.njk

scheme: Gemini

darkmode: false

menu:
  home: /
  archives: /archives/
  categories: /categories/
  about: /about/

menu_settings:
  icons: false
  badges: false

sidebar:
  position: left
  width_expanded: 320
  width_dual_column: 280
  display: always
  padding: 24
  offset: 24

creative_commons:
  license: by-nc-sa
  size: small
  sidebar: false
  post: false
  language: deed.zh

avatar:
  url: /images/avatar.png
  rounded: true
  rotated: false

site_state: true

social:
  GitHub: https://github.com/swagcH || fab fa-github

social_icons:
  enable: true
  icons_only: false
  transition: false

toc:
  enable: true
  number: false
  wrap: true
  expand_all: false
  max_depth: 4

footer:
  since: 2024
  icon:
    name: fa fa-code
    animated: false
    color: '#8b949e'
  copyright: 无敌杰尼龟
  powered: true

theme_color:
  light: '#111111'
  dark: '#e6edf3'

font:
  enable: false
  host:
  global:
    external: false
    family: Menlo
    size: .98
  title:
    external: false
    family: Menlo
    size:
  headings:
    external: false
    family: Menlo
    size:
  posts:
    external: false
    family:
  codes:
    external: false
    family: Menlo

post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: false
    another_day: true
  categories: true

post_edit:
  enable: false

codeblock:
  theme:
    light: stackoverflow-light
    dark: stackoverflow-dark
  prism:
    light: prism
    dark: prism-dark
  copy_button:
    enable: true
    style: mac
  fold:
    enable: false
    height: 500
  language: true

back2top:
  enable: true
  sidebar: false
  scrollpercent: true

reading_progress:
  enable: true
  color: '#713cff'
  height: 2px

bookmark:
  enable: true
  color: '#8b949e'
  save: auto

github_banner:
  enable: false
  permalink: https://github.com/swagcH

motion:
  enable: false
  async: false
  duration: 200
  transition:
    menu_item: fadeInDown
    post_block: fadeIn
    post_header: fadeInDown
    post_body: fadeInDown
    coll_header: fadeInLeft
    sidebar: fadeInUp

pace:
  enable: false

comments:
  style: tabs
  active: null
  storage: true
  lazyload: false
  nav: null

post_footer:
  disqus:
    count: true

busuanzi_count:
  enable: true
  total_visitors: true
  total_visitors_icon: fa fa-user
  total_views: true
  total_views_icon: fa fa-eye
  post_views: true
  post_views_icon: far fa-eye

local_search:
  enable: true
  top_n_per_article: 1
  unescape: false
  preload: false

quicklink:
  enable: false
  home: false
  archive: false
  delay: true
  timeout: 3000
  priority: true
  ignores:

pdf:
  enable: false
  height: 500px

mermaid:
  enable: false
  theme:
    light: default
    dark: dark

wavedrom:
  enable: false

mathjax:
  enable: false

katex:
  enable: false

disqus:
  enable: false
  shortname:
  count: false

google_analytics:
  tracking_id:
  only_pageview: false
  measure_protocol_api_secret:

matomo:
  enable: false
  server_url:
  site_id:

firestore:
  enable: false
  collection: articles
  apiKey:
  projectId:

leancloud_visitors:
  enable: false
  app_id:
  app_key:
  server_url:
  security: false

pjax: false

vendors:
  internal: local
  plugins: jsdelivr
