<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="#07111d"/>
  <text x="72" y="70" fill="#22d3ee" font-family="Menlo,Consolas,monospace" font-size="20">SPRINGCLOUD / ARCHITECTURE</text>
  <text x="72" y="126" fill="#f2f7fb" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700">4 台服务器上的微服务架构</text>

  <g font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <!-- 接入层 -->
    <rect x="72" y="170" width="1136" height="86" rx="10" fill="#101a29" stroke="#22d3ee" stroke-width="2"/>
    <text x="100" y="204" fill="#22d3ee" font-family="Menlo,Consolas,monospace" font-size="16">EDGE</text>
    <rect x="100" y="216" width="200" height="28" rx="6" fill="#0b1522" stroke="#294158"/>
    <text x="122" y="236" fill="#c9d6e2" font-size="15">Nginx（2 台 + 静态资源）</text>
    <rect x="320" y="216" width="220" height="28" rx="6" fill="#0b1522" stroke="#294158"/>
    <text x="342" y="236" fill="#c9d6e2" font-size="15">Gateway（路由/鉴权/限流）</text>
    <rect x="560" y="216" width="200" height="28" rx="6" fill="#0b1522" stroke="#294158"/>
    <text x="582" y="236" fill="#c9d6e2" font-size="15">大屏前端静态资源</text>
    <text x="800" y="236" fill="#6f8497" font-size="14">← 大屏不能白屏，入口必须双活</text>

    <path d="M640 256V292" stroke="#70869b" stroke-width="3"/>
    <path d="M631 280L640 292L649 280" fill="none" stroke="#70869b" stroke-width="3"/>

    <!-- 业务服务 -->
    <rect x="72" y="292" width="720" height="216" rx="12" fill="#0b1522" stroke="#294158"/>
    <text x="100" y="326" fill="#34d399" font-family="Menlo,Consolas,monospace" font-size="16">BUSINESS SERVICES</text>

    <rect x="100" y="342" width="200" height="66" rx="8" fill="#101a29" stroke="#34d399"/>
    <text x="122" y="370" fill="#34d399" font-size="15" font-family="Menlo,Consolas,monospace">metric-service</text>
    <text x="122" y="394" fill="#9eb0c2" font-size="14">9 系统接入 · 580 指标</text>

    <rect x="320" y="342" width="200" height="66" rx="8" fill="#101a29" stroke="#34d399"/>
    <text x="342" y="370" fill="#34d399" font-size="15" font-family="Menlo,Consolas,monospace">board-service</text>
    <text x="342" y="394" fill="#9eb0c2" font-size="14">36 板块数据组装</text>

    <rect x="540" y="342" width="200" height="66" rx="8" fill="#101a29" stroke="#34d399"/>
    <text x="562" y="370" fill="#34d399" font-size="15" font-family="Menlo,Consolas,monospace">screen-service</text>
    <text x="562" y="394" fill="#9eb0c2" font-size="14">各厂监控画面</text>

    <rect x="100" y="422" width="200" height="66" rx="8" fill="#101a29" stroke="#294158"/>
    <text x="122" y="450" fill="#c9d6e2" font-size="15" font-family="Menlo,Consolas,monospace">auth-service</text>
    <text x="122" y="474" fill="#9eb0c2" font-size="14">认证授权 · 菜单权限</text>

    <rect x="320" y="422" width="200" height="66" rx="8" fill="#101a29" stroke="#294158"/>
    <text x="342" y="450" fill="#c9d6e2" font-size="15" font-family="Menlo,Consolas,monospace">system-service</text>
    <text x="342" y="474" fill="#9eb0c2" font-size="14">系统管理 · 字典 · 日志</text>

    <text x="540" y="450" fill="#6f8497" font-size="14">绿色 = 关键服务，双实例</text>
    <text x="540" y="474" fill="#6f8497" font-size="14">灰色 = 非核心，可单点</text>

    <!-- 中间件 -->
    <rect x="832" y="292" width="376" height="216" rx="12" fill="#0b1522" stroke="#294158"/>
    <text x="860" y="326" fill="#fbbf24" font-family="Menlo,Consolas,monospace" font-size="16">MIDDLEWARE</text>

    <rect x="860" y="342" width="320" height="34" rx="6" fill="#101a29" stroke="#fb7185"/>
    <text x="880" y="364" fill="#fb7185" font-size="15" font-family="Menlo,Consolas,monospace">Nacos 集群（2 节点）必须高可用</text>

    <rect x="860" y="386" width="320" height="34" rx="6" fill="#101a29" stroke="#fbbf24"/>
    <text x="880" y="408" fill="#fbbf24" font-size="15" font-family="Menlo,Consolas,monospace">Redis 主从 + 哨兵</text>

    <rect x="860" y="430" width="320" height="34" rx="6" fill="#101a29" stroke="#fbbf24"/>
    <text x="880" y="452" fill="#fbbf24" font-size="15" font-family="Menlo,Consolas,monospace">MySQL 主从 + ShardingSphere</text>

    <text x="860" y="490" fill="#6f8497" font-size="14">注册中心挂了 → 服务无法互相发现</text>

    <!-- 数据源 -->
    <rect x="72" y="548" width="1136" height="96" rx="12" fill="#101a29" stroke="#a78bfa"/>
    <text x="100" y="582" fill="#a78bfa" font-family="Menlo,Consolas,monospace" font-size="16">DATA SOURCES · 9 个异构系统</text>
    <g font-family="Menlo,Consolas,monospace" font-size="14">
      <rect x="100" y="598" width="150" height="30" rx="6" fill="#0b1522" stroke="#294158"/>
      <text x="126" y="619" fill="#c9d6e2">大数据平台</text>
      <rect x="264" y="598" width="120" height="30" rx="6" fill="#0b1522" stroke="#294158"/>
      <text x="298" y="619" fill="#c9d6e2">SIS 系统</text>
      <rect x="398" y="598" width="130" height="30" rx="6" fill="#0b1522" stroke="#294158"/>
      <text x="426" y="619" fill="#c9d6e2">REST API ×n</text>
      <rect x="542" y="598" width="130" height="30" rx="6" fill="#0b1522" stroke="#294158"/>
      <text x="566" y="619" fill="#c9d6e2">数据库直连</text>
      <rect x="686" y="598" width="140" height="30" rx="6" fill="#0b1522" stroke="#294158"/>
      <text x="710" y="619" fill="#c9d6e2">消息订阅</text>
      <rect x="840" y="598" width="130" height="30" rx="6" fill="#0b1522" stroke="#294158"/>
      <text x="868" y="619" fill="#c9d6e2">文件交换</text>
    </g>

    <!-- 底部 -->
    <rect x="72" y="672" width="1136" height="60" rx="10" fill="#0b1522" stroke="#294158"/>
    <text x="104" y="698" fill="#a9bac9" font-family="Menlo,Consolas,monospace" font-size="16">4 台服务器约束下：按【影响面】排序分配高可用资源，不做全组件冗余</text>
    <text x="104" y="721" fill="#6f8497" font-family="Menlo,Consolas,monospace" font-size="14">拆太多 → 排查困难　·　拆太少 → 等于没拆　·　依据：变化频率 &gt; 数据源 &gt; 性能特征</text>
  </g>
</svg>
