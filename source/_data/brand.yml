series:
- slug: ai-coding
  tone: cyan
  eyebrow: AI ENGINEERING
  title: AI 编程与 Vibe Coding
  description: 从理解 Token 和上下文开始，逐步走到真实需求、Java 重构、个人工作流与年度复盘。
  outcome: 建立可验证、可审查、可回退的 AI 编程方法
  posts:
  - 大模型入门：从Token、上下文到幻觉
  - 从Prompt Engineering到Context Engineering：一次提示词改造实验
  - 第一次用AI完成一个真实需求：从需求澄清到上线
  - Vibe Coding不是完全不看代码
  - AI辅助Java重构实战：拆解一个过长Service
  - 我的AI编程工作流：让模型先读懂项目再动手
  - 2025 AI编程实践复盘：效率、安全与能力边界
- slug: java-engineering
  tone: orange
  eyebrow: BACKEND ENGINEERING
  title: Java 后端工程成长
  description: 从项目上手、代码质量和数据库设计，逐步走向可交付的服务骨架与架构演进。
  outcome: 形成从代码实现到工程交付的完整视角
  posts:
  - 新人如何快速熟悉项目
  - 如何阅读遗留代码
  - 代码规范的重要性
  - 数据库设计经验总结
  - Spring Boot项目搭建
  - Git协作开发流程
  - 从单体到微服务总结
  - SpringCloud 微服务拆分：一次真实的架构演进
- slug: reliability
  tone: green
  eyebrow: PRODUCTION RELIABILITY
  title: 稳定性与故障排查
  description: 沿着接口、线程、消息、CPU、内存和磁盘逐层建立生产问题的证据链。
  outcome: 掌握先恢复、留证据、再定位和复盘的排障顺序
  posts:
  - 一次接口超时问题排查
  - 线程池使用踩坑记录
  - 死锁问题定位过程
  - RabbitMQ消息丢失排查
  - Linux服务器CPU飙高问题定位
  - 服务器内存不足与OOM排查
  - 服务器磁盘空间与IO异常定位
- slug: data-layer
  tone: blue
  eyebrow: DATA & MESSAGING
  title: 数据层与消息中间件
  description: 从单表瓶颈到分库分表，从缓存穿透到消息可靠性，按真实问题组织而不是按技术栈罗列。
  outcome: 建立「先诊断再选型」的数据层优化判断力
  posts:
  - ShardingSphere 分库分表实践：从选型到踩坑
  - Redis 缓存设计：穿透、击穿、雪崩的实际处理
  - MySQL 慢查询优化：从执行计划到索引设计
  - RabbitMQ 在微服务解耦中的正确用法
- slug: ai-infra
  tone: purple
  eyebrow: AI INFRASTRUCTURE
  title: AI 基础设施与工程化
  description: 把大模型从「能调通」推进到「能用于生产」：统一网关、降级兜底、成本与可观测性。
  outcome: 理解 LLM 应用在生产环境中的稳定性设计
  posts:
  - 自建 LLM 网关：统一 4 家供应商的架构设计
