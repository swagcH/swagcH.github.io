# Site
title: 杰尼龟的笔记
subtitle: ''
description: 一个 Java 后端开发的技术笔记博客
keywords:
  - Java
  - JUC
  - 并发编程
  - 设计模式
  - Linux
author: 无敌杰尼龟
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://swagcH.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: next

# Deployment
deploy:
  type: git
  repo: https://github.com/swagcH/swagcH.github.io.git
  branch: main
  message:

# Feed
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true

# Sitemap
sitemap:
  path: sitemap.xml

# Search
search:
  path: search.xml
  field: post
  content: true
  format: html